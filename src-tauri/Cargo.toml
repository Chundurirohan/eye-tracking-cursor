[package]
name = "gaze"
version = "4.2.0"
description = "Hands-free cursor control by eye tracking"
authors = ["Rohan Chunduri"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gaze_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.23"


[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
webkit2gtk = "2.0.2"
gio = "0.18"
zbus = { version = "5", default-features = false, features = ["blocking-api"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
reis = { version = "0.7", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
enumflags2 = "0.7"
futures-util = "0.3"
tauri-plugin-single-instance = "2"
