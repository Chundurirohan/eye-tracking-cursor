# Self-hosted Flatpak. Repackages the .deb produced by `tauri build` (see
# scripts/release-linux.sh, which drops it next to this file as gaze.deb) rather
# than building from source — Flathub would require an offline source build with
# vendored cargo/npm sources; that is a later step.
app-id: com.rohanchunduri.eyeapp
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: gaze

finish-args:
  # The overlay windows run under XWayland by design (always-on-top, positioning
  # and click-through are not available to Wayland clients). Input injection on a
  # Wayland session goes through the RemoteDesktop portal, which needs no
  # permission here.
  - --socket=x11
  - --share=ipc
  - --socket=pulseaudio
  # Webcam. WebKitGTK has no camera-portal path yet, so the V4L2 nodes are needed.
  - --device=all
  - --talk-name=org.freedesktop.portal.Desktop
  # Screen magnifier control: GNOME (dconf) and KDE (KWin shortcut service).
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf
  - --talk-name=org.kde.kglobalaccel
  - --env=GDK_BACKEND=x11

modules:
  - name: gaze
    buildsystem: simple
    build-commands:
      - ar -x gaze.deb data.tar.gz
      - tar -xzf data.tar.gz
      - install -Dm755 usr/bin/gaze /app/bin/gaze
      # The deb installs share/ assets under the product name; Flatpak needs the app id.
      - install -Dm644 usr/share/applications/*.desktop /app/share/applications/com.rohanchunduri.eyeapp.desktop
      - sed -i 's/^Icon=.*/Icon=com.rohanchunduri.eyeapp/; s/^Exec=.*/Exec=gaze/' /app/share/applications/com.rohanchunduri.eyeapp.desktop
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/*.png /app/share/icons/hicolor/128x128/apps/com.rohanchunduri.eyeapp.png
      - install -Dm644 com.rohanchunduri.eyeapp.metainfo.xml /app/share/metainfo/com.rohanchunduri.eyeapp.metainfo.xml
    sources:
      - type: file
        path: gaze.deb
      - type: file
        path: com.rohanchunduri.eyeapp.metainfo.xml
